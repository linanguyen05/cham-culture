<script>
function addPost(){
let c=document.getElementById("post").value;

fetch("/add_post",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({content:c})
}).then(load);
}

function load(){
fetch("/get_posts")
.then(res=>res.json())
.then(data=>{
let html="";
data.forEach(p=>{
html += "<div class='post'>"+p.content+"</div>";
});
document.getElementById("list").innerHTML=html;
});
}

load();
