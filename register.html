<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Chăm Culture</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="card">

        <img src="{{ url_for('static', filename='1.png') }}" class="logo">

        <h2>Tạo tài khoản</h2>

        <p>Tham gia cộng đồng Chăm Culture</p>

        <form
            action="{{ url_for('register') }}"
            method="POST"
            enctype="multipart/form-data">

            <input
            type="text"
            name="username"
            placeholder="Tên đăng nhập"
            required>

            <input
            type="email"
            name="email"
            placeholder="Email"
            required>
			
            <input
            type="password"
            name="password"
            placeholder="Mật khẩu"
            required>

            <h4>Chọn ảnh đại diện</h4>
			
			<div class="avatar-preview">
 			  <img
  			      id="previewAvatar"
  			      src="{{ url_for('static', filename='avatars/ma.jpg') }}"
  			      alt="Avatar">
			</div>

            <div class="avatar-grid">

                <label>
                    <input type="radio" name="avatar" value="avatar1.jpg">
                    <img src="{{ url_for('static', filename='avatars/avatar1.jpg') }}">
                </label>

                <label>
                    <input type="radio" name="avatar" value="avatar2.jpg">
                    <img src="{{ url_for('static', filename='avatars/avatar2.jpg') }}">
                </label>

                <label>
                    <input type="radio" name="avatar" value="avatar3.jpg">
                    <img src="{{ url_for('static', filename='avatars/avatar3.jpg') }}">
                </label>

                <label>
                    <input type="radio" name="avatar" value="avatar4.jpg">
                    <img src="{{ url_for('static', filename='avatars/avatar4.jpg') }}">
                </label>

                <label>
                    <input type="radio" name="avatar" value="avatar5.jpg">
                    <img src="{{ url_for('static', filename='avatars/avatar5.jpg') }}">
                </label>

                <label>
                    <input type="radio" name="avatar" value="avatar6.jpg">
                    <img src="{{ url_for('static', filename='avatars/avatar6.jpg') }}">
                </label>

            </div>
            <div class="avatar-upload">
                <input
                    type="file"
                    id="avatarUpload"
                    name="avatarUpload"
                    accept="image/*"
                >

                <label for="avatarUpload" class="upload-btn">
                    <i class="fa-solid fa-image"></i>
                    Chọn ảnh
                </label>
            </div>
            <button type="submit">
                Đăng ký
            </button>

        </form>

        <div class="bottom">

            Đã có tài khoản?

            <a href="/login">
                Đăng nhập
            </a>

        </div>

    </div>

</div>
<script>

const preview = document.getElementById("previewAvatar");

const avatarUpload = document.getElementById("avatarUpload");

document.querySelectorAll(".avatar-grid label").forEach(label=>{

    label.addEventListener("click",()=>{

        // Nếu chọn avatar mặc định thì bỏ file đã chọn
        avatarUpload.value = "";

        const img = label.querySelector("img");

        preview.src = img.src;

    });

});

avatarUpload.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    // Bỏ chọn avatar mặc định
    document.querySelectorAll('input[name="avatar"]').forEach(r=>{
        r.checked = false;
    });

    const reader = new FileReader();

    reader.onload = function(e){

        preview.src = e.target.result;

    }

    reader.readAsDataURL(file);

});

</script>
</body>

</html>
